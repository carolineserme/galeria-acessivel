<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Galeria Inclusiva e Acessível</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <h1>Galeria de Recursos Pedagógicos e Inclusivos</h1>

  <div id="image">
    Passe o mouse ou navegue com a tecla Tab sobre uma imagem abaixo.
  </div>

  <div class="gallery">
    <img class="preview" alt="Menino negro sorridente brincando com blocos de montar coloridos sobre uma mesa de madeira." src="images/foto1.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="Menino com aparelho auditivo modelando massinha colorida em formato de arco-íris e sol." src="images/foto2.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="Menina usando presilha de borboleta organizando cartões de rotina visual em um quadro." src="images/foto3.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="Menina de óculos escuros explorando com as mãos uma caixa tátil sensorial cheia de miçangas." src="images/foto4.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="Menino em cadeira de rodas encaixando formas geométricas coloridas em um tabuleiro de madeira." src="images/foto5.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="Menina concentrada pressionando bolinhas em um brinquedo sensorial do tipo pop-it colorido." src="images/foto6.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
  </div>

</body>
</html>
