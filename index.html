<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Galeria Inclusiva e Acessível</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <h1>Galeria de Recursos Pedagógicos e Inclusivos</h1>

  <div id="image">
    Passe o mouse ou navegue com a tecla Tab sobre uma imagem abaixo.
  </div>

  <div class="gallery">
    <img class="preview" alt="Menino brincando com blocos de montar coloridos no chão." src="images/foto1.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="Menino com aparelho auditivo modelando massinha colorida em diversos formatos." src="images/foto2.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="Menina usando acessório com simbolo do autismo organizando cartões de rotina visual." src="images/foto3.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="Menina cega explorando com as mãos uma caixa tátil sensorial com arroz." src="images/foto4.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="Menino em cadeira de rodas encaixando formas geométricas coloridas em um tabuleiro." src="images/foto5.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
    <img class="preview" alt="Menina concentrada pressionando bolinhas em um brinquedo sensorial colorido." src="images/foto6.jpg" onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
  </div>

</body>
</html>
